# Production Server. LAN values are prefilled from the supplied intranet setup.
server.bind_ip=192.168.10.11
server.port=8080
server.io_threads=2
server.worker_threads=8
network.server_ip=192.168.10.11
network.timeout_ms=5000
server.templates_dir=./server/templates
server.tasks_yaml=./server/Tasks.yaml
server.work_root=/home/chenggong/workspace/galaxcore/test2
server.artifact_root=/home/xshare/zhouwei_runcache/GalaxCore/zip
server.protect_versions_file=./database/protected-versions
server.clock_state_file=./database/clock-state.json
server.daily_log_root=./logs/daily
server.log_archive_root=./logs/workers
log.level=INFO
log.metrics_interval_seconds=60
log.dir=./logs/server
log.retention_days=30
database.path=./database/gcrp.db
database.busy_timeout_ms=5000
database.backup_enabled=true
database.backup_root=./database/backups
database.backup_days=7
database.min_free_bytes=536870912
server.recovery_max_retries=1
server.worker_timeout_seconds=30
scheduler.max_running_tasks=32
scheduler.task_timeout_sec=10800
cache.regression.enabled=false
cache.regression.max_entries=1000
cache.regression.ttl_seconds=5
# Server-local daily snapshots; no Redis or extra database service required.
cache.daily.enabled=true
cache.daily.max_entries=8
cache.daily.max_bytes=67108864
cache.daily.max_snapshot_rows=50000
cache.daily.ttl_seconds=5
cache.daily.historical_ttl_seconds=300
# Weekly mode is edited per machine in GUI and saved in SQLite (Server local time).
# Old Workers stay manual-only until upgraded to resource reporting.
policy.enabled=true
policy.telemetry_stale_seconds=30
policy.memory_critical_percent=10
policy.memory_warn_percent=20
policy.memory_recover_percent=30
policy.cpu_expand_percent=85
policy.stress_seconds=60
policy.recover_seconds=180
policy.step_seconds=120
policy.disk_reserve_mb=5120
